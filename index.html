<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Taste of Home</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/scene.css">
    <link rel="stylesheet" href="css/bowl.css">
    <link rel="stylesheet" href="css/food.css">
    <link rel="stylesheet" href="css/steam.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <div class="background-glow"></div>

    <div class="noise"></div>

    <header class="hero">

        <div class="hero-top">

            <span class="edition">
                Artwork No. 001
            </span>

            <span class="year">
                2026
            </span>

        </div>

        <h1>

            <span class="line-one">The</span>

            <span class="line-two">Taste</span>

            <span class="line-three">of Home</span>

        </h1>

        <p class="subtitle">

            A handcrafted CSS illustration celebrating the warmth,
            beauty and timeless tradition of Congolese cuisine.

        </p>

        <div class="divider"></div>

        <blockquote>

            “Home is not measured in kilometers.
            Sometimes it is simply the aroma waiting on the table.”

        </blockquote>

    </header>

    <main class="scene">

        <section class="art-stage">
              <!-- Wooden table -->
             <div class="table">

                <div class="table-surface"></div>

                <div class="table-light"></div>

                <div class="table-shadow"></div>

            </div>

           <!-- Raffia Placemat -->
            <div class="placemat">

                <div class="placemat-inner"></div>

                <div class="placemat-pattern"></div>

            </div>

           <!-- Bowl -->

            <div class="bowl">

                <div class="bowl-shadow"></div>

                <div class="bowl-body">

                    <div class="bowl-inner">

                        <!-- Food goes here -->

                    </div>

                </div>

            </div>

            <!-- Food -->

            <!-- Steam -->

        </section>

    </main>

    <footer>

        <div>

            Designed & Crafted by

            <strong>Alphonse Kazadi</strong>

        </div>

    </footer>

    <script src="js/app.js"></script>

</body>

</html>
